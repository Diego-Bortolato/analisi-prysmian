name: Analisi Prysmian

# Quando parte:
on:
  workflow_dispatch:        # <- pulsante "Run" per lanciarlo a mano
  schedule:
    # Sabato 06:00 UTC. I dati sono comunque quelli della chiusura di venerdì:
    # partire un giorno prima assorbe i ritardi di GitHub (anche di ore) e
    # garantisce che il report sia pronto prima del task notizie di domenica.
    - cron: "0 6 * * 6"

# Permessi: scrivere il report nel repository
permissions:
  contents: write

jobs:
  analisi:
    runs-on: ubuntu-latest
    steps:
      - name: Prendi i file
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Esegui l'analisi
        run: python analizza.py

      - name: Archivia il report nel repository
        run: |
          DATA=$(TZ=Europe/Rome date +%F)
          echo "DATA=${DATA}" >> "$GITHUB_ENV"
          mkdir -p report
          cp report.txt "report/${DATA}.txt"
          # Indirizzi fissi letti dal task Claude della domenica:
          # precedente.txt = report della settimana prima, ultimo.txt = report di oggi.
          if [ -f report/ultimo.txt ]; then cp report/ultimo.txt report/precedente.txt; fi
          cp report.txt "report/ultimo.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/
          git commit -m "Report tecnico Prysmian ${DATA}" || echo "Nessuna modifica da salvare"
          git push

      - name: Conserva il report anche come allegato
        uses: actions/upload-artifact@v4
        with:
          name: report-prysmian
          path: report.txt
