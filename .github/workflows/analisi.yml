name: Analisi Prysmian

# Quando parte:
on:
  workflow_dispatch:        # <- pulsante "Run" per lanciarlo a mano
  schedule:
    # Sabato 06:00 UTC. I dati sono comunque quelli della chiusura di venerdì:
    # partire un giorno prima assorbe i ritardi di GitHub (anche di ore) e
    # garantisce che la mail sia in casella prima del task notizie di domenica.
    - cron: "0 6 * * 6"

# Permessi: scrivere il report nel repository
permissions:
  contents: write

jobs:
  analisi:
    runs-on: ubuntu-latest
    steps:
      - name: Prendi i file
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Esegui l'analisi
        run: python analizza.py

      - name: Archivia il report nel repository
        run: |
          DATA=$(TZ=Europe/Rome date +%F)
          echo "DATA=${DATA}" >> "$GITHUB_ENV"
          mkdir -p report
          cp report.txt "report/${DATA}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "report/${DATA}.txt"
          git commit -m "Report tecnico Prysmian ${DATA}" || echo "Nessuna modifica da salvare"
          git push

      # Invio diretto via SMTP di Gmail. Non dipende dalle notifiche di GitHub.
      # Richiede due secret nel repository (Settings > Secrets and variables > Actions):
      #   MAIL_USERNAME = diego@errebi.studio
      #   MAIL_PASSWORD = password per le app di Google (16 caratteri)
      - name: Invia il report per mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Motore Prysmian <${{ secrets.MAIL_USERNAME }}>
          to: diego@errebi.studio
          subject: "Report tecnico Prysmian — ${{ env.DATA }}"
          body: file://report.txt
          convert_markdown: false

      - name: Conserva il report anche come allegato
        uses: actions/upload-artifact@v4
        with:
          name: report-prysmian
          path: report.txt
