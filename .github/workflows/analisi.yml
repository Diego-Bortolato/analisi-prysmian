name: Analisi Prysmian

# Quando parte:
on:
  workflow_dispatch:        # <- pulsante "Run" per lanciarlo a mano
  schedule:
    # Sabato 06:00 UTC. I dati sono comunque quelli della chiusura di venerdì:
    # partire un giorno prima assorbe i ritardi di GitHub (anche di ore) e
    # garantisce che il report sia pronto prima dei task di domenica.
    - cron: "0 6 * * 6"

# Permessi: scrivere il report nel repository
permissions:
  contents: write

jobs:
  analisi:
    runs-on: ubuntu-latest
    steps:
      - name: Prendi i file
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Esegui l'analisi (Prysmian)
        run: python analizza.py

      # ETF: se uno fallisce, Prysmian viene archiviato comunque.
      # Simboli alternativi in ordine: Borsa Italiana, poi Xetra (entrambi in EUR).
      - name: Esegui l'analisi (ETF Semiconduttori)
        continue-on-error: true
        run: python analizza.py "SEMI.MI,SEC0.DE" "iShares MSCI Global Semiconductors" report_semi.txt

      - name: Esegui l'analisi (ETF FTSE All-World)
        continue-on-error: true
        run: python analizza.py "VWCE.MI,VWCE.DE" "Vanguard FTSE All-World" report_allworld.txt

      - name: Archivia i report nel repository
        run: |
          DATA=$(TZ=Europe/Rome date +%F)
          # Per ogni strumento: archivio datato + indirizzi fissi letti dai task Claude
          # precedente.txt = report della settimana prima, ultimo.txt = report di oggi.
          archivia () {
            SORGENTE="$1"; CARTELLA="$2"
            [ -f "$SORGENTE" ] || { echo "Manca $SORGENTE: salto"; return 0; }
            mkdir -p "$CARTELLA"
            cp "$SORGENTE" "$CARTELLA/${DATA}.txt"
            if [ -f "$CARTELLA/ultimo.txt" ]; then cp "$CARTELLA/ultimo.txt" "$CARTELLA/precedente.txt"; fi
            cp "$SORGENTE" "$CARTELLA/ultimo.txt"
          }
          archivia report.txt report
          archivia report_semi.txt report/etf-semiconduttori
          archivia report_allworld.txt report/etf-all-world
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/
          git commit -m "Report tecnici ${DATA}" || echo "Nessuna modifica da salvare"
          git push

      - name: Conserva i report anche come allegato
        uses: actions/upload-artifact@v4
        with:
          name: report-settimanali
          path: report*.txt
